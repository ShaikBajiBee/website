
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChronosMatch Trading Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>ChronosMatch</h1>
    <p>Order Matching Engine Dashboard</p>
    <p id="connection">Connecting to backend...</p>
</header>

<main>
    <section class="stats">
        <article class="card">
            <h3>Submitted Orders</h3>
            <p id="orderCount">0</p>
        </article>
        <article class="card">
            <h3>Completed Trades</h3>
            <p id="tradeCount">0</p>
        </article>
    </section>

    <section class="panel">
        <h2>Place an Order</h2>
        <form id="orderForm">
            <label for="side">Order Side</label>
            <select id="side">
                <option value="BUY">BUY</option>
                <option value="SELL">SELL</option>
            </select>

            <label for="price">Price (₹)</label>
            <input id="price" type="number" min="0.01"
                   step="0.01" required>

            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" min="1"
                   step="1" required>

            <button type="submit">Submit Order</button>
        </form>
        <p id="message" role="status"></p>
    </section>

    <section class="panel">
        <h2>Pending Buy Orders</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Price</th><th>Remaining</th></tr>
                </thead>
                <tbody id="buyTable"></tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2>Pending Sell Orders</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Price</th><th>Remaining</th></tr>
                </thead>
                <tbody id="sellTable"></tbody>
            </table>
        </div>
    </section>

    <section class="panel">
        <h2>Completed Trades</h2>
        <button id="refreshButton" type="button">Refresh Dashboard</button>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Trade ID</th>
                        <th>Buy ID</th>
                        <th>Sell ID</th>
                        <th>Price</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody id="tradeTable"></tbody>
            </table>
        </div>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
